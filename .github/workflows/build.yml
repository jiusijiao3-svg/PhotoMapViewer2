name: Build PhotoMapViewer APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Java 17 のセットアップ
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle のセットアップ
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
          cache-disabled: false

      - name: Android SDK ライセンスの自動承諾
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          echo -e "24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e" > "$ANDROID_HOME/licenses/android-sdk-license"

      - name: APKのビルド
        run: gradle assembleDebug --stacktrace

      - name: 完成したAPKをアーティファクトに保存
        uses: actions/upload-artifact@v4
        with:
          name: PhotoMapViewer-APK
          path: app/build/outputs/apk/debug/*.apk
